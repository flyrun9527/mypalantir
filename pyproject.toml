[project]
name = "mypalantir"
version = "0.1.0"
description = "Ontology Augmented Generation — 主项目组装层"
requires-python = ">=3.11"
dependencies = [
    "oag",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "mcp>=1.16",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "click>=8.0",
    "python-dotenv>=1.0",
    "sse-starlette>=1.6",
    "jieba>=0.42",
    "scikit-learn>=1.3",
]

[project.scripts]
oag = "app.cli:cli"

[tool.uv.sources]
oag = { path = "./agent", editable = true }

[tool.setuptools.packages.find]
include = ["app*", "oag_ontology*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
